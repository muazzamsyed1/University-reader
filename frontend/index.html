<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admissions Reader</title>
<style>
  :root{
    --accent:#2f6bff; --accent-ink:#1b50d6; --accent-soft:#eaf0ff;
    --bg:#eef2fb; --panel:#ffffff; --ink:#0f1b33; --muted:#5b6b86;
    --border:#e3e9f5; --ok:#0f8a4d; --ok-soft:#e5f6ec; --warn:#b26a00;
    --warn-soft:#fef3e2; --bad:#c62828; --bad-soft:#fdecec; --shadow:0 6px 24px rgba(23,48,98,.08);
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
       background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  a{color:var(--accent-ink);text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none !important}

  /* ---- Login ---- */
  #login{position:fixed;inset:0;background:linear-gradient(135deg,#2f6bff,#1b3a8c);
         display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .login-card{background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);
              width:100%;max-width:400px;padding:34px}
  .login-card h1{margin:0 0 4px;font-size:21px}
  .login-card p{margin:0 0 22px;color:var(--muted)}
  .brand-badge{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);
               display:flex;align-items:center;justify-content:center;margin-bottom:16px;color:var(--accent-ink)}
  label{display:block;font-weight:600;margin:14px 0 6px;font-size:13px}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);
         border-radius:10px;font-size:14px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
         box-shadow:0 0 0 3px var(--accent-soft)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;
       font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{background:var(--accent-ink)}
  .btn.block{width:100%;justify-content:center;padding:12px;margin-top:20px}
  .btn.ghost{background:#fff;color:var(--accent-ink);border:1px solid var(--border)}
  .btn.ghost:hover{background:var(--accent-soft)}
  .btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
  .btn.ok{background:var(--ok)} .btn.ok:hover{filter:brightness(.92)}
  .btn.bad{background:var(--bad)} .btn.bad:hover{filter:brightness(.92)}
  .err{color:var(--bad);margin-top:12px;font-size:13px;min-height:16px}

  /* ---- Shell ---- */
  #app{display:flex;min-height:100vh}
  #side{width:224px;background:var(--panel);border-right:1px solid var(--border);
        padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
  .logo{display:flex;align-items:center;gap:10px;padding:6px 10px 16px;font-weight:700;font-size:16px}
  .logo .brand-badge{width:34px;height:34px;margin:0;border-radius:9px}
  .nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
       color:var(--muted);font-weight:600;border:none;background:none;width:100%;text-align:left;font-size:13.5px}
  .nav:hover{background:var(--accent-soft);color:var(--accent-ink)}
  .nav.active{background:var(--accent);color:#fff}
  .nav svg{width:18px;height:18px;flex:none}
  .nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:20px;
       font-size:11px;padding:1px 7px;font-weight:700}
  .nav.active .badge{background:#fff;color:var(--bad)}
  .side-foot{margin-top:auto;padding:10px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted)}
  .side-foot b{color:var(--ink);display:block;font-size:13px;word-break:break-all}

  #main{flex:1;min-width:0;padding:22px 26px 80px}
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .page-head h2{margin:0;font-size:20px}
  .page-head .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .toolbar input,.toolbar select{width:auto;min-width:150px}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
        padding:16px 18px;box-shadow:var(--shadow)}
  .card .k{color:var(--muted);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
  .card .v{font-size:26px;font-weight:700;margin-top:6px}
  .card .v small{font-size:13px;color:var(--muted);font-weight:600}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
         box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
  .panel-h{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;
           display:flex;align-items:center;justify-content:space-between;gap:10px}
  .panel-b{padding:16px 18px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
  th{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;
     position:sticky;top:0;background:var(--panel)}
  tr:hover td{background:#fafcff}
  .tscroll{max-height:62vh;overflow:auto}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
  .pill.open{background:var(--ok-soft);color:var(--ok)}
  .pill.close{background:var(--bad-soft);color:var(--bad)}
  .pill.unk{background:#eef1f7;color:var(--muted)}
  .pill.master{background:var(--accent-soft);color:var(--accent-ink)}
  .pill.bachelor{background:#f0ecfb;color:#6b3fd6}
  .tag{display:inline-block;background:#eef1f7;color:var(--muted);border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600}
  .muted{color:var(--muted)}
  .right{text-align:right}
  .nowrap{white-space:nowrap}
  .ico-btn{border:1px solid var(--border);background:#fff;border-radius:8px;width:30px;height:30px;
           display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
  .ico-btn:hover{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-soft)}
  .ico-btn.danger:hover{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
  .ico-btn svg{width:15px;height:15px}
  .tabs{display:inline-flex;background:#eef1f7;border-radius:10px;padding:3px}
  .tab{border:none;background:none;padding:7px 14px;border-radius:8px;font-weight:600;color:var(--muted);font-size:13px}
  .tab.active{background:#fff;color:var(--accent-ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  tr.grouprow td{background:#f3f6fd;font-size:12.5px;border-top:2px solid var(--border);position:sticky}
  tr.grouprow:hover td{background:#f3f6fd}
  h3{font-size:14.5px;color:var(--ink)}
  .diff{background:var(--warn-soft)}
  .diff td{border-color:#f3e2c6}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px}
  .kv .k{color:var(--muted);font-weight:600}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* ---- Modal ---- */
  #modal{position:fixed;inset:0;background:rgba(15,27,51,.45);display:flex;align-items:center;
         justify-content:center;z-index:70;padding:20px}
  .modal-card{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:88vh;
              overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal-h{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:700;font-size:16px;
           display:flex;justify-content:space-between;align-items:center}
  .modal-b{padding:18px 20px}
  .modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

  /* ---- Toast ---- */
  #toasts{position:fixed;right:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:10px}
  .toast{background:#0f1b33;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);
         font-size:13.5px;max-width:340px;animation:slide .25s ease}
  .toast.ok{background:var(--ok)} .toast.bad{background:var(--bad)}
  @keyframes slide{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

  /* ---- Chatbot ---- */
  #chatBtn{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;
           background:var(--accent);color:#fff;border:none;box-shadow:var(--shadow);z-index:60;
           display:flex;align-items:center;justify-content:center;cursor:pointer;
           transition:transform .18s ease, background .18s ease, box-shadow .18s ease}
  #chatBtn:hover{background:var(--accent-ink);transform:translateY(-2px);
                 box-shadow:0 14px 32px rgba(47,107,255,.45)}
  #chatBtn:active{transform:translateY(0)}
  #chatBtn svg{width:26px;height:26px}
  #chat{position:fixed;right:20px;bottom:88px;width:360px;max-width:calc(100vw - 40px);height:460px;
        background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);
        z-index:60;display:flex;flex-direction:column;overflow:hidden}
  .chat-h{background:var(--accent);color:#fff;padding:13px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .chat-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#f6f8fe}
  .msg{padding:9px 13px;border-radius:12px;max-width:85%;white-space:pre-wrap;font-size:13px;line-height:1.5}
  .msg.bot{background:#fff;border:1px solid var(--border);align-self:flex-start}
  .msg.me{background:var(--accent);color:#fff;align-self:flex-end}
  .chat-in{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border)}
  .chat-in input{flex:1}
  @media(max-width:820px){
    #side{position:fixed;left:-240px;transition:left .2s;z-index:80}
    #side.open{left:0}
    #main{padding:16px}
    .grid2{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <form class="login-card" onsubmit="doLogin(event)">
    <div class="brand-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 3 2.5 6 2.5s6-1.5 6-2.5v-5"/></svg>
    </div>
    <h1>Admissions Reader</h1>
    <p>Sign in to the admin portal</p>
    <label>Email</label>
    <input id="loginEmail" type="email" autocomplete="username" placeholder="you@gmail.com" required />
    <label>Password</label>
    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="password" required />
    <button class="btn block" type="submit">Sign in</button>
    <div class="err" id="loginErr"></div>
    <p class="muted" style="text-align:center;margin-top:10px;font-size:12px">Build 2026-11-16-B · <span id="buildCountries">?</span> countries loaded</p>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="logo">
      <span class="brand-badge" style="width:34px;height:34px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 3 2.5 6 2.5s6-1.5 6-2.5v-5"/></svg>
      </span>
      <span>Admissions</span>
    </div>
    <button class="nav active" data-view="overview" onclick="go('overview')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Overview</button>
    <button class="nav" data-view="programs" onclick="go('programs')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Programmes</button>
    <button class="nav" data-view="universities" onclick="go('universities')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/></svg>
      Universities</button>
    <button class="nav" data-view="reader" onclick="go('reader')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.2-8.6"/><path d="M21 3v6h-6"/></svg>
      Reader</button>
    <button class="nav" data-view="changes" onclick="go('changes')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
      Changes <span class="badge hidden" id="chgBadge">0</span></button>
    <button class="nav" data-view="verify" onclick="go('verify')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Verify</button>
    <button class="nav super-only" data-view="admins" onclick="go('admins')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Admins</button>
    <button class="nav super-only" data-view="apikeys" onclick="go('apikeys')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.6 7.6a5 5 0 1 0-7 7 5 5 0 0 0 7-7zm0 0L15 8m0 0l3 3 3-3-3-3"/></svg>
      API Keys</button>
    <button class="nav super-only" data-view="schedule" onclick="go('schedule')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      Schedule</button>
    <div class="side-foot">
      <b id="whoEmail">—</b>
      <span id="whoRole" class="muted"></span>
      <span class="muted" style="display:block;font-size:11px;margin-top:4px">Build 2026-11-16-B · <span id="sideCountries">?</span> countries</span>
      <button class="btn ghost sm" style="margin-top:8px;width:100%;justify-content:center" onclick="logout()">Sign out</button>
    </div>
  </aside>

  <main id="main"></main>
</div>

<!-- chatbot -->
<button id="chatBtn" class="hidden" onclick="toggleChat()" title="Ask the assistant">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.25c-5.1 0-9.25 3.47-9.25 7.75 0 2.4 1.31 4.55 3.36 5.98-.13.92-.5 2.08-1.42 3.12-.3.34-.02.88.43.8 1.96-.34 3.4-1.13 4.29-1.74.84.17 1.71.26 2.59.26 5.1 0 9.25-3.47 9.25-7.75S17.1 3.25 12 3.25Z" fill="currentColor"/><circle cx="8.4" cy="11" r="1.15" fill="#fff"/><circle cx="12" cy="11" r="1.15" fill="#fff"/><circle cx="15.6" cy="11" r="1.15" fill="#fff"/></svg>
</button>
<div id="chat" class="hidden">
  <div class="chat-h"><span>Admissions Assistant</span><button class="ico-btn" style="background:none;border:none;color:#fff" onclick="toggleChat()">&times;</button></div>
  <div class="chat-body" id="chatBody"></div>
  <form class="chat-in" onsubmit="sendChat(event)">
    <input id="chatInput" placeholder="Ask about a university…" autocomplete="off" />
    <button class="btn" type="submit">Send</button>
  </form>
</div>

<div id="modal" class="hidden"></div>
<div id="toasts"></div>

<!-- Server injects the real country list here so the dropdowns are populated
     even before any API call runs. Replaced at serve time; [] if unavailable. -->
<script>window.__COUNTRIES__ = /*__COUNTRIES_JSON__*/[];</script>

<script>
// ============ state & helpers ============
const S = { token:null, me:null, countries:(window.__COUNTRIES__||[]).slice(), view:'overview',
            progDegree:'', progCountry:'', progStatus:'', progQ:'', uniCountry:'', uniQ:'',
            chStatus:'PENDING', chCountry:'' };
try{ var _bc=document.getElementById('buildCountries');
     if(_bc) _bc.textContent=(window.__COUNTRIES__||[]).length; }catch(e){}

function tok(){ return localStorage.getItem('ar_token'); }
function setAuth(t, me){ localStorage.setItem('ar_token', t); localStorage.setItem('ar_me', JSON.stringify(me)); S.token=t; S.me=me; }
function clearAuth(){ localStorage.removeItem('ar_token'); localStorage.removeItem('ar_me'); S.token=null; S.me=null; }

async function api(path, opts){
  opts = opts||{};
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(tok()) opts.headers['Authorization'] = 'Bearer '+tok();
  const r = await fetch('/api/v1'+path, opts);
  if(r.status===401){ clearAuth(); showLogin('Session expired — please sign in again.'); throw new Error('Not authenticated'); }
  const ct = r.headers.get('content-type')||'';
  const data = ct.indexOf('json')>=0 ? await r.json() : await r.text();
  if(!r.ok){ throw new Error((data && data.detail) ? data.detail : ('Error '+r.status)); }
  return data;
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function toast(msg, kind){ const t=document.createElement('div'); t.className='toast '+(kind||''); t.textContent=msg;
  document.getElementById('toasts').appendChild(t); setTimeout(function(){t.remove();},3800); }
function isSuper(){ return S.me && S.me.is_super; }

// ============ login ============
function showLogin(msg){ document.getElementById('app').classList.add('hidden');
  document.getElementById('chatBtn').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('loginErr').textContent = msg||''; }

async function doLogin(e){
  e.preventDefault();
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  document.getElementById('loginErr').textContent='';
  try{
    const r = await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:email,password:password})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail||'Login failed');
    setAuth(d.access_token, {email:d.email, role:d.role, full_name:d.full_name,
                             countries:d.countries, is_super:d.role==='SUPER_ADMIN'});
    await boot();
  }catch(err){ document.getElementById('loginErr').textContent = err.message; }
}
function logout(){ clearAuth(); showLogin(); }

async function boot(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('chatBtn').classList.remove('hidden');
  try{ var _sc=document.getElementById('sideCountries'); if(_sc) _sc.textContent=S.countries.length; }catch(e){}
  document.getElementById('whoEmail').textContent = S.me.email;
  document.getElementById('whoRole').textContent = S.me.is_super ? 'Super admin'
      : 'Country admin · '+(S.me.countries||[]).join(', ');
  document.querySelectorAll('.super-only').forEach(function(el){ el.classList.toggle('hidden', !isSuper()); });
  await loadCountries();
  go('overview');
  refreshBadge();
}
async function loadCountries(){
  try{
    const c = await api('/countries');
    if(Array.isArray(c) && c.length){ S.countries=c; return S.countries; }
  }catch(e){ /* fall through to fallback */ }
  // Fallback: derive the country list from the universities the user can see,
  // so the dropdowns always offer the real countries even if /countries fails.
  try{
    const us = await api('/universities');
    const seen={}; const out=[];
    (us||[]).forEach(function(u){
      const code=u.country_code; if(!code||seen[code]) return; seen[code]=1;
      out.push({id:code, code:code, name:u.country_name||code,
                university_count:0, master_count:0, bachelor_count:0, program_count:0});
    });
    out.sort(function(a,b){ return a.name.localeCompare(b.name); });
    S.countries = out;
  }catch(e){
    S.countries=[];
    toast('Could not load countries — '+(e.message||'please refresh'),'bad');
  }
  return S.countries;
}
async function ensureCountries(){ if(!S.countries||!S.countries.length) await loadCountries(); return S.countries; }
function countryWarn(){
  if(S.countries&&S.countries.length) return '';
  return '<div class="panel" style="border-color:var(--bad)"><div class="panel-b" style="color:var(--bad)">'+
    '⚠ The country list did not load, so the dropdown only shows “All countries”. '+
    'This is almost always an old cached page. '+
    '<button class="btn sm" onclick="retryCountries()">Retry now</button></div></div>';
}
async function retryCountries(){ await loadCountries();
  if(S.countries.length) toast('Loaded '+S.countries.length+' countries','ok');
  else toast('Still could not load countries — reopen in an incognito window','bad');
  go(S.view); }
async function refreshBadge(){
  try{ const s = await api('/stats');
    const b=document.getElementById('chgBadge');
    if(s.pending_changes>0){ b.textContent=s.pending_changes; b.classList.remove('hidden'); }
    else b.classList.add('hidden');
  }catch(e){}
}

async function loadPrograms(){
  const wrap=document.getElementById('pWrap');
  if(wrap) wrap.innerHTML='<div class="panel"><div class="panel-b empty">Loading…</div></div>';
  const qs = new URLSearchParams({limit:'2000'});
  if(S.progDegree) qs.set('degree',S.progDegree);
  if(S.progCountry) qs.set('country',S.progCountry);
  if(S.progStatus) qs.set('status',S.progStatus);
  if(S.progQ) qs.set('q',S.progQ);
  const rows = await api('/programs?'+qs.toString());
  S.progById={}; rows.forEach(function(p){ S.progById[p.id]=p; });

  // group programmes by university, preserving API order (already sorted by uni name)
  const groups=[]; const idx={};
  rows.forEach(function(p){ const k=p.university_id;
    if(idx[k]===undefined){ idx[k]=groups.length;
      groups.push({id:k, name:p.university_name, cc:p.country_code, cn:p.country_name, progs:[]}); }
    groups[idx[k]].progs.push(p); });

  // overview for the current filter
  const mTot=rows.filter(function(p){return (p.degree_level||'').toUpperCase()==='MASTER';}).length;
  const bTot=rows.length-mTot;
  const openTot=rows.filter(function(p){return (p.status||'').toUpperCase()==='OPEN';}).length;
  const scopeName = S.progCountry
    ? ((S.countries.find(function(c){return c.code===S.progCountry;})||{}).name||S.progCountry)
    : 'All countries';
  const overview='<div class="cards" style="margin-bottom:14px">'+
    card('Scope', esc(scopeName))+card('Universities', groups.length)+
    card("Master's", mTot)+card("Bachelor's", bTot)+card('Open now', openTot)+
    '</div>';

  function progTable(progs){
    return '<div class="tscroll"><table><thead><tr>'+
      '<th>Programme</th><th>Degree</th><th>Status</th><th>Opens</th><th>Deadline</th>'+
      '<th>Fee</th><th>CGPA</th><th>English</th><th>Link</th><th></th></tr></thead><tbody>'+
      progs.map(function(p){ return '<tr>'+
        '<td><b>'+esc(p.name)+'</b></td>'+
        '<td>'+degPill(p.degree_level)+'</td>'+
        '<td>'+statusPill(p.status)+'</td>'+
        '<td>'+(esc(p.application_opening_date)||'<span class=muted>—</span>')+'</td>'+
        '<td>'+(esc(p.deadline)||'<span class=muted>—</span>')+'</td>'+
        '<td>'+(esc(p.apply_fee)||'<span class=muted>—</span>')+'</td>'+
        '<td>'+(esc(trim(p.cgpa_required,40))||'<span class=muted>—</span>')+'</td>'+
        '<td>'+(esc(trim(p.english_required,40))||'<span class=muted>—</span>')+'</td>'+
        '<td>'+(p.apply_link?'<a href="'+esc(p.apply_link)+'" target="_blank" rel="noopener">open</a>':'<span class=muted>—</span>')+'</td>'+
        '<td class="nowrap">'+
          '<button class="ico-btn" title="Edit" onclick="editProg(\''+p.id+'\')">'+icoEdit()+'</button> '+
          '<button class="ico-btn danger" title="Delete" onclick="delProgram(\''+p.id+'\')">'+icoTrash()+'</button>'+
        '</td></tr>'; }).join('')+
      '</tbody></table></div>';
  }
  function uniPanel(g){
    const m=g.progs.filter(function(p){return (p.degree_level||'').toUpperCase()==='MASTER';}).length;
    const b=g.progs.length-m;
    return '<div class="panel" style="margin-bottom:12px"><div class="panel-h">'+
      '<span><b>'+esc(g.name)+'</b> <span class="tag">'+esc(g.cc||'')+'</span></span>'+
      '<span class="nowrap"><span class="muted">'+m+" master's · "+b+" bachelor's</span> "+
        '<button class="btn ghost sm" onclick="openUniversity(\''+g.id+'\')">Open university</button></span></div>'+
      progTable(g.progs)+'</div>';
  }

  const body = groups.length
    ? groups.map(uniPanel).join('')
    : '<div class="panel"><div class="panel-b empty">No programmes match this filter.</div></div>';
  if(wrap) wrap.innerHTML = overview + body;
  const pc=document.getElementById('pCount');
  if(pc) pc.textContent = rows.length+' programme(s) across '+groups.length+' university(ies)';
}

  if(!cmp.rows||!cmp.rows.length) return head+'<div class="panel"><div class="panel-b empty">No programme pages were parsed. Add an apply/portal link to a programme, then read again.</div></div>';
  const body=cmp.rows.map(function(row){
    const flds=row.fields.filter(function(f){return f.read||f.stored;});
    const inner=flds.length?flds.map(function(f){
      return '<tr class="'+(f.changed?'diff':'')+'"><td class="muted">'+esc(f.field)+'</td>'+
        '<td>'+(esc(f.stored)||'<span class=muted>—</span>')+'</td>'+
        '<td><b>'+(esc(f.read)||'<span class=muted>—</span>')+'</b>'+(f.changed?' <span class="tag" style="background:var(--warn-soft);color:var(--warn)">changed</span>':'')+'</td></tr>';
    }).join(''):'<tr><td colspan=3 class="muted">Page read, but no criteria were found on it.</td></tr>';
    return '<div class="panel"><div class="panel-h"><span><b>'+esc(row.program)+'</b> '+degPill(row.degree_level)+'</span>'+
      '<span class="muted">'+(row.link_alive?('HTTP '+(row.http_status||'')):'unreachable')+' · '+(row.read_chars||0)+' chars</span></div>'+
      readFromLine(row)+

  }).join('');
  const tip='<div class="muted" style="margin:6px 2px 10px">Changes found here are waiting in <a href="#" onclick="go(\'changes\');return false">Changes</a> for approval.</div>';
  return head+(r.changes?tip:'')+body;
}

async function startRead(){

  const note=document.getElementById('r_note');

  try{
    const est=await api('/reader/estimate'+(c?('?countries='+c):''));
    if(note) note.textContent='Estimated time: '+est.estimated_human+' ('+est.unique_pages+' page(s), '+est.engine+').';
  }catch(e){}
  const qs=new URLSearchParams(); if(c)qs.set('countries',c); if(ai)qs.set('use_ai',ai); if(mx)qs.set('max_pages',mx);
  if(discover)qs.set('discover','true');
  const res = await api('/reader/run?'+qs.toString(),{method:'POST'});
  toast(res.message, res.run_id?'ok':'');
  const estTxt=(note&&note.textContent)?note.textContent+' — ':'';
  if(note) note.textContent=estTxt+res.message;
  if(res.run_id) S.activeRun=res.run_id;
  pollRuns();
}

async function showCompare(runId){
  const wrap=document.getElementById('compareWrap');
  wrap.innerHTML='<div class="panel"><div class="panel-b empty">Loading comparison…</div></div>';
  const res = await Promise.all([
    api('/reader/runs/'+runId+'/compare'),
    api('/changes?status=PENDING&run='+runId).catch(function(){return [];})
  ]);
  const cmp=res[0], changes=res[1];
  const chgMap={}; (changes||[]).forEach(function(ch){ chgMap[(ch.program_id||'')+'|'+ch.field]=ch.id; });
  if(!cmp.rows.length){ wrap.innerHTML='<div class="panel"><div class="panel-b empty">'+esc(cmp.message)+'</div></div>'; return; }
  const rowsHtml = cmp.rows.map(function(r){
    const flds = r.fields.filter(function(f){return f.read||f.stored;});
    const inner = flds.map(function(f){
      const chId = chgMap[r.program_id+'|'+f.field];
      const act = (f.changed && chId) ?
        '<button class="btn ok sm" onclick="review(\''+chId+'\',\'approve\',\''+runId+'\')">Approve</button> '+
        '<button class="btn bad sm" onclick="review(\''+chId+'\',\'decline\',\''+runId+'\')">Decline</button>' : '';

        '<td>'+(esc(f.stored)||'<span class=muted>—</span>')+'</td>'+
        '<td>'+(esc(f.read)||'<span class=muted>—</span>')+(f.changed?' <span class="tag" style="background:var(--warn-soft);color:var(--warn)">changed</span>':'')+'</td>'+
        '<td class="nowrap">'+act+'</td></tr>';
    }).join('');
    return '<div class="panel"><div class="panel-h">'+
        '<span><b>'+esc(r.university)+'</b> — '+esc(r.program)+' '+degPill(r.degree_level)+'</span>'+
        '<span class="muted">'+(r.link_alive?('HTTP '+(r.http_status||'')):'unreachable')+' · '+(r.read_chars||0)+' chars · '+r.changed_count+' change(s)</span></div>'+
      readFromLine(r)+
      '<table><thead><tr><th>Criterion</th><th>Stored</th><th>Read from page</th><th></th></tr></thead>'+
      '<tbody>'+inner+'</tbody></table></div>';
  }).join('');
  wrap.innerHTML = '<div class="page-head" style="margin-top:8px"><div><h2>Read vs stored</h2>'+
      '<div class="sub">'+cmp.total+' programme(s) · '+cmp.changed+' with changes · engine: '+(cmp.used_ai?'AI':'regex')+'</div></div>'+
      '<button class="btn" onclick="downloadRun(\''+runId+'\')">'+icoDownload()+' Download Excel</button></div>'+rowsHtml;
}

async function loadChanges(){
  const st=S.chStatus||'PENDING', c=S.chCountry||'';
  const wrap=document.getElementById('chWrap');
  let rows;
  try{ rows=await api('/changes?status='+st+(c?('&country='+c):'')); }
  catch(e){ if(wrap) wrap.innerHTML='<div class="panel"><div class="panel-b" style="color:var(--bad)">'+esc(e.message)+'</div></div>'; return; }
  const cc=document.getElementById('chCount');
  if(cc) cc.textContent=rows.length+' '+st.toLowerCase()+' change(s)'+(c?(' · '+c):'');
  if(!rows.length){ if(wrap) wrap.innerHTML='<div class="panel"><div class="panel-b empty">No '+st.toLowerCase()+' changes'+(c?(' for '+c):'')+'.</div></div>'; return; }
  // sort then group by country + university (gives a clear sequence)
  rows.sort(function(a,b){ return (a.country||'').localeCompare(b.country||'')||
    (a.university||'').localeCompare(b.university||'')||(a.program||'').localeCompare(b.program||''); });
  const groups=[]; const idx={};
  rows.forEach(function(ch){ const k=(ch.country||'')+'|'+(ch.university||'');
    if(idx[k]===undefined){ idx[k]=groups.length; groups.push({cc:ch.country_code, uni:ch.university, country:ch.country, items:[]}); }
    groups[idx[k]].items.push(ch); });
  function rowHtml(ch){
    const act = ch.status==='PENDING'
      ? '<button class="btn ok sm" onclick="review(\''+ch.id+'\',\'approve\')">Approve</button> '+
        '<button class="btn bad sm" onclick="review(\''+ch.id+'\',\'decline\')">Decline</button>'
      : '<span class="pill '+(ch.status==='APPROVED'?'open':'close')+'">'+esc(ch.status)+'</span> '+
        '<button class="ico-btn danger" title="Remove from list" onclick="removeChange(\''+ch.id+'\')">'+icoTrash()+'</button>';
    return '<tr><td>'+esc(ch.program||'—')+' '+(ch.degree_level?degPill(ch.degree_level):'')+'</td>'+
      '<td class="muted">'+esc(fieldLabel(ch.field))+' <span class="tag">'+esc(changeTypeLabel(ch.change_type))+'</span></td>'+
      '<td>'+(esc(trim(ch.old_value,50))||'<span class=muted>—</span>')+'</td>'+
      '<td style="color:var(--accent);text-align:center">&rarr;</td>'+
      '<td><b>'+(esc(trim(ch.new_value,50))||'<span class=muted>—</span>')+'</b></td>'+
      '<td class="nowrap">'+act+'</td></tr>';
  }
  if(wrap) wrap.innerHTML = groups.map(function(g){
    return '<div class="panel" style="margin-bottom:12px"><div class="panel-h">'+
        '<span><b>'+esc(g.uni||'—')+'</b> <span class="tag">'+esc(g.cc||'')+'</span></span>'+
        '<span class="muted">'+g.items.length+' change(s)</span></div>'+
      '<div class="tscroll"><table><thead><tr><th>Programme</th><th>Field</th><th>Stored</th><th></th><th>Proposed</th><th></th></tr></thead>'+
      '<tbody>'+g.items.map(rowHtml).join('')+'</tbody></table></div></div>';
  }).join('');
}

  const out=document.getElementById('exploreOut');
  out.innerHTML='<div class="panel"><div class="panel-b empty">Looking up “'+esc(uni)+'”… this can take up to a minute.</div></div>';
  try{
    const r=await api('/verify/explore',{method:'POST',body:JSON.stringify({
      university:uni, country_code:val('x_country'), program:val('x_prog'),
      degree_level:val('x_deg'), url:val('x_url')||null})});
    _explored=r;
    if(!r.ok){ out.innerHTML='<div class="panel"><div class="panel-b" style="color:var(--bad)">'+esc(r.message)+'</div></div>'; return; }
    const keys=['status','application_opening_date','deadline','apply_fee','cgpa_required','english_required'];
    const labels={status:'Status',application_opening_date:'Application opens',deadline:'Deadline',

    out.innerHTML='<div class="panel"><div class="panel-h">'+

        '<span class="muted">HTTP '+(r.http_status||'—')+' · '+(r.text_chars||0)+' chars · '+(r.used_ai?'AI':'regex')+'</span></div>'+
      '<div class="panel-b"><span class="muted">Read from:</span> <a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(trim(r.url,80))+'</a>'+
        (r.discovered?' <span class="tag">link found automatically</span>':'')+
        (r.page_title?'<div class="muted">'+esc(r.page_title)+'</div>':'')+'</div>'+

async function saveExplored(){

  if(!val('x_country')){ toast('Choose the country first','bad'); return; }
  try{
    const res=await api('/verify/explore/save',{method:'POST',body:JSON.stringify({
      university:_explored.university, country_code:val('x_country'),
      program:_explored.program||val('x_prog'), degree_level:_explored.degree_level,
      university_type:val('x_type')||null, url:_explored.url,
      criteria:_explored.criteria||{}})});

async function runReadUrl(){
  const url=val('v_url'); if(!url){toast('Enter a URL');return;}
  const out=document.getElementById('readUrlOut'); out.innerHTML='<div class="muted">Reading…</div>';
  try{
    const r=await api('/verify/read-url',{method:'POST',body:JSON.stringify({url:url, program_id:val('v_pid')||null})});
    const keys=['status','application_opening_date','deadline','apply_fee','cgpa_required','english_required'];
    const labels={status:'Status',application_opening_date:'Application opens',deadline:'Deadline',
      apply_fee:'Application fee',cgpa_required:'CGPA required',english_required:'English required'};
    const matched = r.university_name || r.program_name;
    const header = matched
      ? '<div class="panel-h" style="border:none;padding:0 0 10px"><span><b>'+esc(r.university_name||'')+'</b>'+
        (r.program_name?' — '+esc(r.program_name):'')+'</span><span class="muted">matched by link</span></div>'
      : '<div class="muted" style="margin-bottom:8px">No stored programme matched this link — showing what the reader read.</div>';
    const rows=keys.map(function(k){ const changed=norm(r.read_criteria[k])&&norm(r.read_criteria[k])!==norm(r.stored_criteria[k]);
      return '<tr class="'+(matched&&changed?'diff':'')+'">'+
        '<td class="muted">'+labels[k]+'</td><td>'+(esc(r.stored_criteria[k])||'<span class=muted>—</span>')+'</td>'+
        '<td><b>'+(esc(r.read_criteria[k])||'<span class=muted>—</span>')+'</b>'+(matched&&changed?' <span class="tag" style="background:var(--warn-soft);color:var(--warn)">differs</span>':'')+'</td></tr>'; }).join('');
    out.innerHTML=header+
      '<div class="muted" style="margin-bottom:8px">'+esc(r.message)+' '+(r.used_ai?'<span class="tag">AI</span>':'<span class="tag">regex</span>')+' · HTTP '+(r.http_status||'—')+' · '+r.text_chars+' chars read</div>'+
      '<table><thead><tr><th>Criterion</th><th>Stored</th><th>Read from the page</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }catch(e){ out.innerHTML='<div style="color:var(--bad)">'+esc(e.message)+'</div>'; }
}
function norm(s){ return (s==null?'':String(s)).trim().toLowerCase(); }

// icons
async function downloadExcel(path, fallbackName){
  try{
    toast('Preparing Excel…');
    const r=await fetch('/api/v1'+path,{headers: tok()?{'Authorization':'Bearer '+tok()}:{}});
    if(!r.ok) throw new Error('Download failed ('+r.status+')');
    let name=fallbackName;
    const cd=r.headers.get('content-disposition')||'';
    const m=cd.match(/filename="?([^"]+)"?/); if(m) name=m[1];
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },1500);
    toast('Downloaded '+name,'ok');
  }catch(e){ toast(e.message,'bad'); }
}
function downloadPrograms(){
  const qs=new URLSearchParams();
  if(S.progCountry) qs.set('country',S.progCountry);
  if(S.progDegree)  qs.set('degree',S.progDegree);
  if(S.progStatus)  qs.set('status',S.progStatus);
  if(S.progQ)       qs.set('q',S.progQ);
  const q=qs.toString();
  downloadExcel('/export/programs.xlsx'+(q?('?'+q):''), 'programmes.xlsx');
}
